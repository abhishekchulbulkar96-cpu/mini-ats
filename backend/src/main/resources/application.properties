spring.application.name=MiniAts

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atsdb}
spring.datasource.username=${DB_USERNAME:atsuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

spring.datasource.hikari.data-source-properties.options=-c TimeZone=Asia/Kolkata

